kind = "web"
previewPath = "/"
title = "FalconTrust RAG Candidate"
version = "1.0.0"
id = "artifacts/rag-candidate"
router = "path"

[[integratedSkills]]
name = "react-vite"
version = "1.0.0"

[[services]]
name = "web"
paths = [ "/" ]
localPort = 18371

[services.development]
run = "pnpm --filter @workspace/rag-candidate run dev"

[services.production]
build = [ "pnpm", "--filter", "@workspace/rag-candidate", "run", "build" ]
publicDir = "artifacts/rag-candidate/dist/public"
serve = "static"

[[services.production.rewrites]]
from = "/*"
to = "/index.html"

[services.env]
PORT = "18371"
BASE_PATH = "/"
